<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parkur Yarışı</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #101820;
    font-family: 'Courier New', monospace;
    color: #eaf2f8;
  }

  h1 { letter-spacing: 2px; margin-bottom: 18px; color: #4fc3f7; }

  .panel {
    background: #16222c;
    border: 2px solid #2c3e50;
    border-radius: 10px;
    padding: 28px 32px;
    width: 340px;
    text-align: center;
  }

  .panel input {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 6px;
    border: 1px solid #34495e;
    background: #0d151b;
    color: #eaf2f8;
    font-family: inherit;
    font-size: 15px;
    text-align: center;
  }

  .panel button {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    border-radius: 6px;
    border: none;
    background: #4fc3f7;
    color: #0d151b;
    font-family: inherit;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
  }

  .panel button.secondary {
    background: #34495e;
    color: #eaf2f8;
  }

  .panel button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  #roomCodeDisplay {
    font-size: 32px;
    letter-spacing: 6px;
    color: #ffd54f;
    margin: 10px 0;
    font-weight: bold;
  }

  #playerList {
    list-style: none;
    text-align: left;
    margin: 12px 0;
    max-height: 160px;
    overflow-y: auto;
  }

  #playerList li {
    padding: 5px 8px;
    border-bottom: 1px dashed #2c3e50;
    display: flex;
    justify-content: space-between;
  }

  .host-tag {
    color: #ffd54f;
    font-size: 11px;
  }

  #errorMsg {
    color: #ef5350;
    font-size: 13px;
    min-height: 18px;
    margin-top: 6px;
  }

  #characterGrid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin: 10px 0 14px;
  }

  .char-option {
    cursor: pointer;
    border: 2px solid transparent;
    border-radius: 6px;
    padding: 4px;
    text-align: center;
    background: #0d151b;
  }

  .char-option.selected {
    border-color: #4fc3f7;
  }

  .char-swatch {
    width: 100%;
    height: 52px;
    border-radius: 4px;
    margin-bottom: 3px;
    background: #050a0d;
    image-rendering: pixelated;
  }

  .char-name {
    font-size: 8px;
    color: #cfd8dc;
    line-height: 1.15;
  }

  /* ---- Yarış ekranı ---- */
  #raceScreen { display: none; flex-direction: column; align-items: center; }

  #raceBar {
    width: 700px;
    max-width: 92vw;
    background: #16222c;
    border: 2px solid #2c3e50;
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 10px;
  }

  .race-lane {
    position: relative;
    height: 18px;
    background: #0d151b;
    border-radius: 4px;
    margin: 4px 0;
  }

  .race-marker {
    position: absolute;
    top: -3px;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: left 0.15s linear;
  }

  .race-name {
    font-size: 10px;
    color: #90a4ae;
  }

  #gameContainer {
    position: relative;
    border: 2px solid #4fc3f7;
    border-radius: 6px;
    background: #0d151b;
  }

  canvas { display: block; }

  #countdownOverlay, #resultOverlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
  }

  #countdownNumber {
    font-size: 64px;
    color: #ffd54f;
    font-weight: bold;
  }

  #resultList {
    list-style: none;
    margin-top: 12px;
  }

  #resultList li {
    padding: 4px 0;
    font-size: 15px;
  }

  #instructions {
    margin-top: 12px;
    color: #78909c;
    font-size: 13px;
    text-align: center;
  }
</style>
</head>
<body>

  <h1>🏁 PARKUR YARIŞI</h1>

  <!-- ---- Lobi ekranı ---- -->
  <div class="panel" id="lobbyScreen">
    <input type="text" id="nameInput" placeholder="İsmini yaz" maxlength="14">
    <div style="font-size:11px; color:#78909c; margin-top:10px;">KARAKTERİNİ SEÇ</div>
    <div id="characterGrid"></div>
    <button id="createRoomBtn">Yeni Parti Kur</button>
    <div style="margin: 14px 0; color:#546e7a; font-size:12px;">— veya —</div>
    <input type="text" id="joinCodeInput" placeholder="Oda kodu (ör. AB3XZ)" maxlength="5" style="text-transform:uppercase;">
    <button id="joinRoomBtn" class="secondary">Odaya Katıl</button>
    <div id="errorMsg"></div>
  </div>

  <!-- ---- Bekleme odası ---- -->
  <div class="panel" id="waitingScreen" style="display:none;">
    <div style="font-size:13px; color:#90a4ae;">ODA KODU (arkadaşlarına gönder)</div>
    <div id="roomCodeDisplay">-----</div>
    <ul id="playerList"></ul>
    <button id="startRaceBtn" style="display:none;">Yarışı Başlat</button>
    <div id="waitingHostNote" style="font-size:12px; color:#90a4ae; margin-top:6px;"></div>
  </div>

  <!-- ---- Yarış ekranı ---- -->
  <div id="raceScreen">
    <div id="raceBar"></div>

    <div id="gameContainer">
      <canvas id="gameCanvas" width="700" height="280"></canvas>
      <div id="countdownOverlay"><div id="countdownNumber">3</div></div>
      <div id="resultOverlay">
        <h2>🏆 Yarış Bitti!</h2>
        <ol id="resultList"></ol>
        <button id="backToLobbyBtn" style="width:200px; margin-top:14px;">Lobiye Dön</button>
      </div>
    </div>

    <div id="instructions">Zıplamak için <b>SPACE</b> / <b>↑</b> — Engellere çarpmak seni biraz yavaşlatır, oyunu bitirmez</div>
  </div>

<script>
(() => {
  // ============================================================
  // KURULUM: Bu istemcinin bağlanacağı sunucu adresi. Sunucuyu
  // Render/Railway gibi bir servise yükledikten sonra sana verilen
  // adresi buraya yapıştırman gerekiyor.
  // ============================================================
  const SERVER_URL = 'https://parkur-race.onrender.com';

  const socket = io(SERVER_URL, { transports: ['websocket', 'polling'] });

  // ---- Ekran elemanları ----
  const lobbyScreen = document.getElementById('lobbyScreen');
  const waitingScreen = document.getElementById('waitingScreen');
  const raceScreen = document.getElementById('raceScreen');

  const nameInput = document.getElementById('nameInput');
  const createRoomBtn = document.getElementById('createRoomBtn');
  const joinCodeInput = document.getElementById('joinCodeInput');
  const joinRoomBtn = document.getElementById('joinRoomBtn');
  const errorMsg = document.getElementById('errorMsg');

  const roomCodeDisplay = document.getElementById('roomCodeDisplay');
  const playerListEl = document.getElementById('playerList');
  const startRaceBtn = document.getElementById('startRaceBtn');
  const waitingHostNote = document.getElementById('waitingHostNote');

  const raceBarEl = document.getElementById('raceBar');
  const countdownOverlay = document.getElementById('countdownOverlay');
  const countdownNumber = document.getElementById('countdownNumber');
  const resultOverlay = document.getElementById('resultOverlay');
  const resultListEl = document.getElementById('resultList');
  const backToLobbyBtn = document.getElementById('backToLobbyBtn');

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;
  const GROUND_Y = 220;

  let myId = null;
  let isHost = false;
  let roomCode = null;
  let seed = null;
  let finishDistance = 3000;
  let players = []; // sunucudan gelen oyuncu listesi

  // ---- Renkli pixel-art karakterler: 8 özgün tasarım ----
  const RUNNER_PX = 2.4;

  // Üst gövde (kafa+saç+tişört+kollar) tüm karakterlerde aynı şekil,
  // sadece renkler (colors) farklı. Alt kısım (bacak+araç) her karakterde
  // farklı bir "araç" göstersin diye ayrı ayrı tanımlı.
  const TOP_ROWS = [
    ".....hhhhhh.....",
    ".....hhhhhh.....",
    ".....kkkkkk.....",
    ".....kkkkek.....",
    ".....kkkkkk.....",
    ".....kkkkkk.....",
    "....ssssssss....",
    ".kkksssssssskkk.",
    ".kkksssssssskkk.",
    "....ssssssss....",
    "....ssssssss....",
    "....ssssssss...."
  ];

  const STANDING_LEGS = [
    ".....ppp.ppp....",
    ".....ppp.ppp....",
    ".....ppp.ppp...."
  ];
  const TOGETHER_LEGS = [
    ".......pp.......",
    ".......pp.......",
    ".......pp......."
  ];

  const CHARACTERS = [
    {
      name: 'Kaykaycı Kai',
      colors: { h: '#4e342e', k: '#ffcc80', e: '#212121', s: '#42a5f5', p: '#263238', o: '#212121', b: '#ff7043', w: '#111111' },
      bottom: [...STANDING_LEGS,
        "....ooooooooo...",
        "..bbbbbbbbbbbb..",
        "..bbbbbbbbbbbb..",
        "...ww......ww...",
        "...ww......ww..."]
    },
    {
      name: 'Bisikletli Ela',
      colors: { h: '#ffd54f', k: '#ffcc80', e: '#212121', s: '#66bb6a', p: '#263238', o: '#212121', b: '#37474f', w: '#111111' },
      bottom: [...STANDING_LEGS,
        "....o......o....",
        ".....bbbbbbb....",
        "....b......b....",
        "...ww......ww...",
        "...ww......ww..."]
    },
    {
      name: 'Scooterlı Sam',
      colors: { h: '#3e2723', k: '#ffe0b2', e: '#212121', s: '#ab47bc', p: '#263238', o: '#212121', b: '#ffb300', w: '#111111' },
      bottom: [
        ".....ppp.ppp....",
        "....bppp.ppp....",
        "....bppp.ppp....",
        "....booooooo....",
        "..bbbbbbbbbbbb..",
        "..bbbbbbbbbbbb..",
        "...ww......ww...",
        "...ww......ww..."]
    },
    {
      name: 'Tekerlekli Tara',
      colors: { h: '#8d6e63', k: '#ffcc80', e: '#212121', s: '#ec407a', p: '#263238', o: '#212121', w: '#111111' },
      bottom: [...TOGETHER_LEGS,
        ".......oo.......",
        "......wwww......",
        ".....w....w.....",
        "......wwww......",
        "................"]
    },
    {
      name: 'Paten Peri',
      colors: { h: '#ffab91', k: '#ffe0b2', e: '#212121', s: '#26c6da', p: '#263238', o: '#d81b60', w: '#111111' },
      bottom: [...STANDING_LEGS,
        "....ooo....ooo..",
        "....o.o....o.o..",
        "................",
        "...ww......ww...",
        "...ww......ww..."]
    },
    {
      name: 'Roket Rıza',
      colors: { h: '#212121', k: '#ffcc80', e: '#212121', s: '#7e57c2', p: '#263238', o: '#212121', b: '#5c6bc0', f: '#64ffda' },
      bottom: [...STANDING_LEGS,
        "....ooooooooo...",
        "..bbbbbbbbbbbb..",
        "..bbbbbbbbbbbb..",
        "...ff.ff.ff.ff..",
        "................"]
    },
    {
      name: 'Pogo Poyraz',
      colors: { h: '#6d4c41', k: '#ffcc80', e: '#212121', s: '#ffca28', p: '#263238', o: '#212121', c: '#9e9e9e' },
      bottom: [...TOGETHER_LEGS,
        ".......oo.......",
        ".......cc.......",
        "......cccc......",
        ".......cc.......",
        "......cccc......"]
    },
    {
      name: 'Arabalı Ada',
      colors: { h: '#d4e157', k: '#ffe0b2', e: '#212121', s: '#ef5350', p: '#263238', o: '#212121', c: '#8d6e63', w: '#111111' },
      bottom: [...STANDING_LEGS,
        "....ooooooooo...",
        ".wccccccccccccw.",
        ".wccccccccccccw.",
        ".ww........ww...",
        "................"]
    }
  ];

  let selectedCharacter = 0;

  const characterGridEl = document.getElementById('characterGrid');
  characterGridEl.innerHTML = CHARACTERS.map((c, i) => `
    <div class="char-option${i === 0 ? ' selected' : ''}" data-index="${i}">
      <canvas class="char-swatch" width="60" height="52" data-preview="${i}"></canvas>
      <div class="char-name">${c.name}</div>
    </div>
  `).join('');

  // Her karakterin gerçek pixel-art görünümünü küçük önizleme canvas'ına çiz
  CHARACTERS.forEach((c, i) => {
    const previewCanvas = characterGridEl.querySelector(`canvas[data-preview="${i}"]`);
    const pctx = previewCanvas.getContext('2d');
    const grid = [...TOP_ROWS, ...c.bottom];
    const px = Math.min(
      previewCanvas.width / grid[0].length,
      previewCanvas.height / grid.length
    );
    const offsetX = (previewCanvas.width - grid[0].length * px) / 2;
    const offsetY = (previewCanvas.height - grid.length * px) / 2;
    drawColorSprite(pctx, grid, c.colors, offsetX, offsetY, px);
  });

  characterGridEl.addEventListener('click', (e) => {
    const opt = e.target.closest('.char-option');
    if (!opt) return;
    selectedCharacter = Number(opt.dataset.index);
    characterGridEl.querySelectorAll('.char-option').forEach(el => el.classList.remove('selected'));
    opt.classList.add('selected');
  });

  function getCharacterColor(name) {
    const found = CHARACTERS.find(c => c.name === name);
    return found ? found.colors.s : '#4fc3f7';
  }

  // ---- Lobi mantığı ----
  createRoomBtn.addEventListener('click', () => {
    const name = nameInput.value.trim() || 'Oyuncu';
    socket.emit('create-room', { name, character: CHARACTERS[selectedCharacter].name });
  });

  joinRoomBtn.addEventListener('click', () => {
    const name = nameInput.value.trim() || 'Oyuncu';
    const code = joinCodeInput.value.trim().toUpperCase();
    if (!code) { errorMsg.textContent = 'Lütfen bir oda kodu gir.'; return; }
    socket.emit('join-room', { code, name, character: CHARACTERS[selectedCharacter].name });
  });

  socket.on('connect', () => { myId = socket.id; });

  socket.on('room-created', (data) => enterWaitingRoom(data));
  socket.on('room-joined', (data) => enterWaitingRoom(data));
  socket.on('join-error', ({ message }) => { errorMsg.textContent = message; });

  function enterWaitingRoom(data) {
    roomCode = data.code;
    seed = data.seed;
    finishDistance = data.finishDistance;
    isHost = data.isHost;
    errorMsg.textContent = '';
    lobbyScreen.style.display = 'none';
    waitingScreen.style.display = 'block';
    roomCodeDisplay.textContent = roomCode;
    startRaceBtn.style.display = isHost ? 'block' : 'none';
    waitingHostNote.textContent = isHost
      ? 'En az 1 kişi daha katılınca yarışı başlatabilirsin (istersen tek başına da başlatabilirsin).'
      : 'Oda sahibinin yarışı başlatmasını bekle...';
  }

  socket.on('room-update', ({ players: list, hostId }) => {
    players = list;
    isHost = hostId === myId;
    startRaceBtn.style.display = isHost ? 'block' : 'none';
    playerListEl.innerHTML = list.map(p =>
      `<li><span>${p.name}</span>${p.id === hostId ? '<span class="host-tag">👑 KURUCU</span>' : ''}</li>`
    ).join('');
    updateRaceBar();
  });

  startRaceBtn.addEventListener('click', () => {
    socket.emit('start-race');
  });

  backToLobbyBtn.addEventListener('click', () => {
    socket.emit('leave-room');
    location.reload();
  });

  // ---- Yarış çubuğu (herkesin ilerlemesi) ----
  function updateRaceBar() {
    raceBarEl.innerHTML = players.map(p => {
      const pct = Math.min(100, (p.distance / finishDistance) * 100);
      const mine = p.id === myId;
      const color = getCharacterColor(p.character);
      return `
        <div class="race-name">${p.name}${mine ? ' (sen)' : ''}${p.finished ? ' 🏁' : ''}</div>
        <div class="race-lane">
          <div class="race-marker" style="left:${pct}%; background:${color}; border-radius:50%; border:2px solid #16222c;"></div>
        </div>
      `;
    }).join('');
  }

  // ---- Yarış: fizik ve çizim ----
  let gameActive = false;
  let raceOver = false;
  let myDistance = 0;
  let speed = 3.4; // birim/kare
  let stunFrames = 0;
  let legFrame = 0;
  let frameCount = 0;

  const runner = {
    y: 0,
    vy: 0,
    height: 34,
    width: 28,
    gravity: 0.85,
    jumpForce: -13.5,
    isJumping: false
  };
  runner.y = GROUND_Y - runner.height;

  function drawColorSprite(targetCtx, grid, colorMap, x, y, px) {
    for (let row = 0; row < grid.length; row++) {
      const line = grid[row];
      for (let col = 0; col < line.length; col++) {
        const ch = line[col];
        if (ch !== '.') {
          targetCtx.fillStyle = colorMap[ch];
          targetCtx.fillRect(x + col * px, y + row * px, px, px);
        }
      }
    }
  }


  let obstacles = []; // [{distance, width, height}]

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function generateTrack(trackSeed) {
    const rand = mulberry32(trackSeed);
    const types = ['hurdle', 'spike', 'crate'];
    const list = [];
    let d = 350;
    while (d < finishDistance - 120) {
      const type = types[Math.floor(rand() * types.length)];
      const height = type === 'crate' ? 34 + Math.floor(rand() * 12) : 28 + Math.floor(rand() * 18);
      list.push({ distance: d, width: type === 'crate' ? 30 : 24, height, type });
      d += 170 + rand() * 190;
    }
    return list;
  }

  socket.on('race-started', ({ startAt }) => {
    obstacles = generateTrack(seed);
    myDistance = 0;
    speed = 3.4;
    stunFrames = 0;
    runner.y = GROUND_Y - runner.height;
    runner.vy = 0;
    runner.isJumping = false;
    raceOver = false;
    resultOverlay.style.display = 'none';

    waitingScreen.style.display = 'none';
    raceScreen.style.display = 'flex';

    const tick = () => {
      const remaining = startAt - Date.now();
      if (remaining <= 0) {
        countdownOverlay.style.display = 'none';
        gameActive = true;
        requestAnimationFrame(loop);
        return;
      }
      countdownOverlay.style.display = 'flex';
      countdownNumber.textContent = Math.ceil(remaining / 1000);
      requestAnimationFrame(tick);
    };
    tick();
  });

  function jump() {
    if (!gameActive || raceOver) return;
    if (!runner.isJumping) {
      runner.vy = runner.jumpForce;
      runner.isJumping = true;
    }
  }

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      jump();
    }
  });
  canvas.addEventListener('mousedown', jump);
  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); }, { passive: false });

  let lastEmit = 0;

  function update() {
    if (!gameActive || raceOver) return;

    frameCount++;
    if (stunFrames > 0) {
      stunFrames--;
    } else {
      myDistance += speed;
    }
    if (!runner.isJumping && frameCount % 6 === 0) {
      legFrame = (legFrame + 1) % 2;
    }

    runner.vy += runner.gravity;
    runner.y += runner.vy;
    const floorY = GROUND_Y - runner.height;
    if (runner.y > floorY) {
      runner.y = floorY;
      runner.vy = 0;
      runner.isJumping = false;
    }

    // Çarpışma kontrolü: yaklaşan engellerden birine değdiysek küçük bir ceza uygula
    for (const o of obstacles) {
      if (o.hit) continue;
      const obstacleScreenX = 100 + (o.distance - myDistance);
      if (obstacleScreenX > 85 && obstacleScreenX < 115) {
        const runnerBottom = runner.y + runner.height;
        const obstacleTop = GROUND_Y - o.height;
        if (runnerBottom > obstacleTop + 6) {
          o.hit = true;
          stunFrames = 30;
          speed = Math.max(2, speed - 0.3);
        }
      }
    }

    if (myDistance >= finishDistance && !raceOver) {
      myDistance = finishDistance;
      raceOver = true;
      socket.emit('finish-race');
    }

    const now = performance.now();
    if (now - lastEmit > 120) {
      socket.emit('update-progress', { distance: Math.floor(myDistance) });
      lastEmit = now;
    }
  }

  function drawHurdle(x, y, width, height) {
    // İki dikme + üstte bar (klasik atletizm engeli)
    ctx.fillStyle = '#ff8a65';
    ctx.fillRect(x - width / 2, y - height, 4, height);
    ctx.fillRect(x + width / 2 - 4, y - height, 4, height);
    ctx.fillRect(x - width / 2 - 3, y - height, width + 6, 6);
  }

  function drawSpike(x, y, width, height) {
    // Sivri, dişli bir engel (üçgen dizisi)
    ctx.fillStyle = '#e53935';
    const teeth = 3;
    const toothW = width / teeth;
    for (let i = 0; i < teeth; i++) {
      const tx = x - width / 2 + i * toothW;
      ctx.beginPath();
      ctx.moveTo(tx, y);
      ctx.lineTo(tx + toothW / 2, y - height);
      ctx.lineTo(tx + toothW, y);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawCrate(x, y, width, height) {
    // Çapraz çizgili sandık
    ctx.fillStyle = '#8d6e63';
    ctx.fillRect(x - width / 2, y - height, width, height);
    ctx.strokeStyle = '#5d4037';
    ctx.lineWidth = 2;
    ctx.strokeRect(x - width / 2 + 2, y - height + 2, width - 4, height - 4);
    ctx.beginPath();
    ctx.moveTo(x - width / 2 + 2, y - height + 2);
    ctx.lineTo(x + width / 2 - 2, y - 2);
    ctx.moveTo(x + width / 2 - 2, y - height + 2);
    ctx.lineTo(x - width / 2 + 2, y - 2);
    ctx.stroke();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0d151b';
    ctx.fillRect(0, 0, W, H);

    // Zemin
    ctx.strokeStyle = '#37474f';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    ctx.lineTo(W, GROUND_Y);
    ctx.stroke();

    // Bitiş çizgisi
    const finishScreenX = 100 + (finishDistance - myDistance);
    if (finishScreenX > -20 && finishScreenX < W + 20) {
      ctx.fillStyle = '#ffd54f';
      ctx.fillRect(finishScreenX, GROUND_Y - 90, 4, 90);
      ctx.fillStyle = '#0d151b';
      ctx.font = 'bold 11px monospace';
      ctx.fillText('BİTİŞ', finishScreenX - 10, GROUND_Y - 96);
    }

    // Engeller (tipe göre farklı görsel)
    obstacles.forEach(o => {
      const x = 100 + (o.distance - myDistance);
      if (x > -30 && x < W + 30) {
        if (o.type === 'spike') drawSpike(x, GROUND_Y, o.width, o.height);
        else if (o.type === 'crate') drawCrate(x, GROUND_Y, o.width, o.height);
        else drawHurdle(x, GROUND_Y, o.width, o.height);
      }
    });

    // Koşucu (seçilen karakter, hafif inip kalkma animasyonu ile)
    const character = CHARACTERS[selectedCharacter];
    const grid = [...TOP_ROWS, ...character.bottom];
    const bob = runner.isJumping ? 0 : Math.sin(frameCount * 0.35) * 1.5;
    const spriteX = 100 - (grid[0].length * RUNNER_PX) / 2;
    const spriteY = runner.y - (grid.length * RUNNER_PX - runner.height) + bob;
    const colors = stunFrames > 0
      ? { ...character.colors, s: '#ff8a65' } // çarpınca tişört rengi değişsin (görsel geri bildirim)
      : character.colors;
    drawColorSprite(ctx, grid, colors, spriteX, spriteY, RUNNER_PX);
  }

  function loop() {
    update();
    draw();
    updateRaceBar();
    if (!raceOver) {
      requestAnimationFrame(loop);
    } else {
      draw();
    }
  }

  socket.on('race-over', () => {
    gameActive = false;
    const finishers = players
      .filter(p => p.finished)
      .sort((a, b) => (a.placement || 99) - (b.placement || 99));
    const others = players.filter(p => !p.finished);
    const finalList = [...finishers, ...others];

    resultListEl.innerHTML = finalList.map((p, i) => {
      const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}.`;
      return `<li>${medal} ${p.name}${p.finished ? '' : ' (bitirmedi)'}</li>`;
    }).join('');
    resultOverlay.style.display = 'flex';
  });

  draw();
})();
</script>

</body>
